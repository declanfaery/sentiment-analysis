[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis"
version = "0.1.0"
description = "Twitter/X stock sentiment and earnings traction scanner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas-market-calendars>=5.0.0",
    "vaderSentiment>=3.3.2",
    "webull-openapi-python-sdk>=2.0.16",
    "yfinance>=0.2.40",
]

[project.scripts]
sentiment-scan = "sentiment_analysis.cli:main"
sentiment-dashboard = "sentiment_analysis.dashboard:main"
sentiment-trader = "sentiment_analysis.trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
